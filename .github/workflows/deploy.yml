name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# The site has two parts:
#   /neural-net-builder/                  the main app, built from STABLE_REF (the version that was already live)
#   /neural-net-builder/pattern-memory/   the current master; it opens straight into the pattern-memory demo
# To make the main page follow master too, set STABLE_REF to master.
env:
  STABLE_REF: 2b113ec3c2269bf485835ec82eb1d6023e666907

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout main page version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STABLE_REF }}
          path: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            current/package-lock.json
            stable/package-lock.json

      - name: Build main page
        working-directory: stable
        run: |
          npm ci
          npm run build

      - name: Build pattern-memory page
        working-directory: current
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/neural-net-builder/pattern-memory/

      - name: Assemble site
        run: |
          mkdir -p site/pattern-memory
          cp -r stable/dist/. site/
          cp -r current/dist/. site/pattern-memory/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
